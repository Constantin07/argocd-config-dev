apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preview-root
  namespace: argocd
  finalizers:
    # The default behaviour is foreground cascading deletion
    - resources-finalizer.argocd.argoproj.io
spec:
  project: admin
  source:
    repoURL: 'https://github.com/Constantin07/argocd-config-dev.git'
    path: preview
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
